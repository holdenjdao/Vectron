[project]
name = "vectron"
version = "0.1.0"
description = "Vectron software factory: agent-orchestrated generation of system diagrams and modular code."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.8,<2",
    "black>=24.8",
    "isort>=5.13",
    "fastapi>=0.115",
    "jinja2>=3.1",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
vectron = "vectron.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vectron"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["src/vectron/codegen/python/templates"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF012"]
