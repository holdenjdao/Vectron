<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Vectron: a software factory where agents design systems and build modular code." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Vectron</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #070b10;
             color: #d7e3ee; font: 16px/1.5 Inter, "Segoe UI", Roboto, system-ui, sans-serif; }
      main { text-align: center; padding: 16px; }
      h1 { font-weight: 300; font-size: clamp(2rem, 6vw, 3.5rem); margin: 0 0 0.5rem; }
      a { display: inline-block; margin-top: 1.5rem; padding: 0.7rem 1.4rem; border: 1px solid #38e0a0;
          color: #38e0a0; text-decoration: none; letter-spacing: 0.08em; text-transform: uppercase; }
    </style>
  </head>
  <body>
    <main>
      <h1>Vectron</h1>
      <p>Describe a system. A crew of agents designs it and builds the code.</p>
      <a href="/app/">Launch Vectron</a>
    </main>
  </body>
</html>
